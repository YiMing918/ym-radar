<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雷达站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1116; --card: #171c24; --card2: #1e2530; --line: #2a3342;
    --text: #e8edf4; --muted: #93a1b5; --accent: #4da3ff; --accent2: #ffb84d;
    --warn-bg: #3a2a16; --warn-text: #ffcf87; --ok: #57d977;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 48px; }
  header.top { padding: 18px 2px 8px; }
  header.top h1 { font-size: 28px; letter-spacing: 1px; }
  header.top p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .back { display: inline-block; margin: 10px 0 4px; color: var(--accent); font-size: 15px; cursor: pointer; }
  /* 首页栏目卡 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }
  .cat-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; cursor: pointer; }
  .cat-card:active { background: var(--card2); }
  .cat-card h3 { font-size: 17px; margin-bottom: 6px; }
  .cat-card .blurb { color: var(--muted); font-size: 12.5px; min-height: 36px; }
  .cat-card .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .cat-card .cnt { color: var(--accent); font-weight: 700; font-size: 20px; }
  .cat-card .upd { color: var(--muted); font-size: 11px; text-align: right; }
  /* 栏目页 */
  .cat-head h2 { font-size: 22px; margin-top: 6px; }
  .cat-head .blurb { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .search { width: 100%; margin: 14px 0 6px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; cursor: pointer; background: var(--card); }
  .chip.on { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .sec-title { font-size: 16px; margin: 20px 2px 10px; color: var(--accent2); }
  .item-card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .item-card:active { background: var(--card2); }
  .thumb { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px; overflow: hidden; background: var(--card2);
    display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { font-size: 26px; font-weight: 700; color: var(--accent); }
  .item-main { flex: 1; min-width: 0; }
  .item-main .nm { font-size: 15.5px; font-weight: 600; }
  .item-main .sm { color: var(--muted); font-size: 12.5px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item-side { text-align: right; flex: 0 0 auto; }
  .score { color: var(--accent2); font-weight: 700; font-size: 15px; }
  .rank { color: var(--muted); font-size: 11px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; }
  .tag.lang { color: var(--accent); border-color: var(--accent); }
  .tag.region { color: var(--ok); border-color: #2c5b3a; }
  .tag.cnok { color: var(--ok); border-color: #2c5b3a; }
  .tag.cnwarn { color: #ffb84d; border: 1px solid #ff9f2e; background: #3d2f17; font-weight: 700; }
  .tag.risk { color: #ff9f2e; border: 1px solid #ff9f2e; background: #3d2f17; font-weight: 700; }
  .kind { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; margin-top: 6px; }
  .kind.config { background: #173d24; color: var(--ok); }
  .kind.api { background: #3d2f17; color: var(--accent2); }
  /* 详情页 */
  .detail-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; margin-top: 10px; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; }
  .detail-head .thumb { flex-basis: 72px; width: 72px; height: 72px; }
  .detail-head .thumb .ph { font-size: 34px; }
  .detail-head h2 { font-size: 20px; line-height: 1.35; }
  .detail-head .sm { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .kind-big { display: block; border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
  .kind-big.config { background: #173d24; color: #b9f4cd; }
  .kind-big.api { background: #3d2f17; color: #ffe1ae; }
  .kind-big b { font-size: 15px; }
  .kind-big .note { display: block; margin-top: 4px; font-weight: 400; }
  h4.sec { font-size: 15px; margin: 18px 0 8px; color: var(--accent); }
  .desc { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  table.kv { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.kv td { border-top: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
  table.kv td.k { color: var(--muted); width: 96px; flex: none; }
  table.kv td.v { word-break: break-word; }
  .urlrow { display: flex; gap: 8px; align-items: flex-start; }
  .urlrow .u { flex: 1; min-width: 0; word-break: break-all; }
  .copy-btn { flex: 0 0 auto; background: var(--card2); color: var(--accent); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
  .copy-btn.done { color: var(--ok); border-color: var(--ok); }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 14px; }
  .meta-line { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .shots { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px; -webkit-overflow-scrolling: touch; }
  .shots img { height: 220px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; flex: 0 0 auto; }
  .no-shot { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 99; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .err { color: #ff8a8a; text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">加载中…</div></div>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="截图大图"></div>
<script>
(function () {
  var DATA = null;
  var app = document.getElementById('app');
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  lightbox.addEventListener('click', function () { lightbox.classList.remove('open'); lbImg.src = ''; });

  var SECTION_LABELS = {
    main: '主榜', adult: '成人榜', limited_free: '限免', price_drop: '降价',
    discounts: '降价', testflight: 'TestFlight 招募', deals: '限时赠金', permanent: '长期免费',
    long_term: '长期免费', long: '长视频', short: '短视频', app: 'APP',
    disguised: '伪装类应用', iapfree: '限时零元购永久',
    'android-free': '安卓好用软件', 'android-cracked': '安卓破解软件',
    'pc-free': '电脑全免费软件', 'pc-cracked': '电脑破解软件',
    android: '安卓', ios: 'iOS', windows: 'Windows', mac: 'macOS',
    linux: 'Linux', router: '路由器', all: '全平台'
  };
  var CAT_SECTION_LABELS = {
    apple: { deals: '限免', discounts: '降价', testflight: 'TestFlight 招募', disguised: '伪装类应用', iapfree: '限时零元购永久', ipasign: 'IPA 自签包' }
  };
  function sectionLabel(slug, s) {
    return (CAT_SECTION_LABELS[slug] || {})[s] || SECTION_LABELS[s] || s || '其他';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString('zh-CN', { hour12: false });
  }
  function isUrl(v) {
    return typeof v === 'string' && /^https?:\/\/\S+$/.test(v.trim());
  }
  function thumbHtml(item, big) {
    var first = esc((item.name || '?').trim().charAt(0) || '?');
    if (item.imageUrl) {
      return '<div class="thumb"><img src="' + esc(item.imageUrl) + '" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<span class=&quot;ph&quot;>' + first + '</span>\'"></div>';
    }
    return '<div class="thumb"><span class="ph">' + first + '</span></div>';
  }
  function copyBtn(value) {
    return '<button class="copy-btn" data-copy="' + esc(value) + '">复制</button>';
  }
  function urlRow(label, value) {
    if (!value) return '';
    return '<h4 class="sec">' + esc(label) + '</h4><div class="urlrow"><span class="u"><a href="' + esc(value) + '" target="_blank" rel="noopener">' + esc(value) + '</a></span>' + copyBtn(value) + '</div>';
  }
  function kindBadge(item) {
    if (item.usageKind === 'config') return '<span class="kind config">整份配置</span>';
    if (item.usageKind === 'api') return '<span class="kind api">单个接口（零件）</span>';
    return '';
  }
  function detailVal(item, label) {
    var v = '';
    (item.details || []).forEach(function (d) { if (d.label === label) v = d.value || ''; });
    return v;
  }
  function metaTags(slug, item) {
    var h = '';
    var lang = detailVal(item, '语言');
    if (lang) h += '<span class="tag lang">' + esc(lang) + '</span>';
    if (slug === 'apple' || slug === 'app') {
      var cn = detailVal(item, '能否改中文');
      if (cn) {
        var warn = cn.indexOf('只有英文') === 0;
        h += '<span class="tag ' + (warn ? 'cnwarn' : 'cnok') + '">' + esc(cn) + '</span>';
      }
      var region = detailVal(item, '下载地区');
      if (region) h += '<span class="tag region">' + esc(region) + '</span>';
    }
    if ((item.section || '').indexOf('cracked') >= 0) {
      h += '<span class="tag risk">⚠ 破解 · 有风险</span>';
    }
    return h ? '<div class="tags">' + h + '</div>' : '';
  }
  function priceTag(slug, item) {
    if (slug !== 'apple') return '';
    var p = detailVal(item, '现价');
    if (!p) return '';
    if (/免费/.test(p) || /^free$/i.test(p.trim())) {
      return '<div class="tags"><span class="tag region">' + (p.indexOf('参加') >= 0 ? esc(p) : '免费') + '</span></div>';
    }
    var m = p.match(/[¥$￥]\s*\d+(?:\.\d+)?/);
    return '<div class="tags"><span class="tag cnwarn">' + esc(m ? m[0] : p) + '</span></div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.stopPropagation();
    var text = b.getAttribute('data-copy');
    function done() {
      var old = b.textContent;
      b.textContent = '已复制'; b.classList.add('done');
      setTimeout(function () { b.textContent = old; b.classList.remove('done'); }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta); done();
    }
  });

  /* ---------- 首页 ---------- */
  function renderHome() {
    var cats = DATA.overview.categories || [];
    var total = cats.reduce(function (s, c) { return s + (c.count || 0); }, 0);
    var h = '<header class="top"><h1>雷达站</h1><p>' + cats.length + ' 个栏目 · 共 ' + total + ' 条 · 数据导出于雷达站</p></header><div class="grid">';
    cats.forEach(function (c) {
      h += '<div class="cat-card" data-cat="' + esc(c.slug) + '"><h3>' + esc(c.name) + '</h3>' +
        '<div class="blurb">' + esc(c.blurb) + '</div>' +
        '<div class="meta"><span class="cnt">' + (c.count || 0) + ' 条</span>' +
        '<span class="upd">更新<br>' + esc(fmtTime(c.lastSuccessAt || c.lastAttemptAt)) + '</span></div></div>';
    });
    h += '</div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-cat]').forEach(function (el) {
      el.addEventListener('click', function () { location.hash = '#/cat/' + el.getAttribute('data-cat'); });
    });
  }

  /* ---------- 栏目页 ---------- */
  function itemCard(slug, item) {
    var h = '<div class="item-card" data-item="' + item.id + '">' + thumbHtml(item) +
      '<div class="item-main"><div class="nm">' + esc(item.name) + '</div>' +
      '<div class="sm">' + esc(item.summary) + '</div>' + kindBadge(item) + priceTag(slug, item) + metaTags(slug, item);
    if (item.tags && item.tags.length) {
      h += '<div class="tags">' + item.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    h += '</div><div class="item-side">' +
      (item.score != null ? '<div class="score">' + item.score + '</div>' : '') +
      '<div class="rank">第 ' + item.rank + ' 名</div></div></div>';
    return h;
  }

  var curSub = '';
  var SUBCAT_ORDER = ['免费域名', '免费主机/托管', '免费邮箱', '免费数据库', '免费证书', '免费存储/图床', '免费 API'];
  function renderCategory(slug, query, sub) {
    if (sub !== undefined) curSub = sub;
    var pack = DATA.categories[slug];
    if (!pack) { app.innerHTML = '<div class="err">栏目不存在</div>'; return; }
    var cat = pack.category;
    var items = (pack.items || []).slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); });
    var q = (query || '').trim().toLowerCase();
    if (q) {
      items = items.filter(function (it) {
        return (it.name || '').toLowerCase().indexOf(q) >= 0 || (it.summary || '').toLowerCase().indexOf(q) >= 0;
      });
    }
    var chipsHtml = '';
    if (slug === 'service') {
      var present = [];
      (pack.items || []).forEach(function (it) {
        var c = detailVal(it, '类别');
        if (c && present.indexOf(c) < 0) present.push(c);
      });
      present.sort(function (a, b) {
        var ia = SUBCAT_ORDER.indexOf(a), ib = SUBCAT_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      if (curSub) {
        items = items.filter(function (it) { return detailVal(it, '类别') === curSub; });
      }
      chipsHtml = '<div class="chips"><span class="chip' + (curSub ? '' : ' on') + '" data-sub="">全部</span>' +
        present.map(function (c) {
          return '<span class="chip' + (curSub === c ? ' on' : '') + '" data-sub="' + esc(c) + '">' + esc(c) + '</span>';
        }).join('') + '</div>';
    }
    var h = '<span class="back" id="back-home">← 返回总览</span>' +
      '<div class="cat-head"><h2>' + esc(cat.name) + '</h2><div class="blurb">' + esc(cat.blurb) + ' · 共 ' + items.length + ' 条 · 更新于 ' + esc(fmtTime(cat.lastSuccessAt || cat.lastAttemptAt)) + '</div></div>' +
      '<input class="search" id="search" type="search" placeholder="在本栏目里搜名称或简介…" value="' + esc(query || '') + '">' + chipsHtml;
    if (!items.length) {
      h += '<div class="empty">没有找到符合的条目</div>';
    } else {
      var sections = [];
      items.forEach(function (it) { var s = it.section || ''; if (sections.indexOf(s) < 0) sections.push(s); });
      if (sections.length > 1) {
        sections.forEach(function (s) {
          h += '<div class="sec-title">' + esc(sectionLabel(slug, s)) + '</div>';
          items.filter(function (it) { return (it.section || '') === s; }).forEach(function (it) { h += itemCard(slug, it); });
        });
      } else {
        items.forEach(function (it) { h += itemCard(slug, it); });
      }
    }
    app.innerHTML = h;
    document.getElementById('back-home').addEventListener('click', function () { location.hash = '#/'; });
    var search = document.getElementById('search');
    var timer = null;
    search.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { renderCategory(slug, search.value, curSub); var s2 = document.getElementById('search'); s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }, 200);
    });
    app.querySelectorAll('[data-sub]').forEach(function (el) {
      el.addEventListener('click', function () { renderCategory(slug, search.value, el.getAttribute('data-sub')); });
    });
    app.querySelectorAll('[data-item]').forEach(function (el) {
      el.addEventListener('click', function () { location.hash = '#/item/' + slug + '/' + el.getAttribute('data-item'); });
    });
  }

  /* ---------- 详情页 ---------- */
  function renderDetail(slug, id) {
    var pack = DATA.categories[slug];
    if (!pack) { app.innerHTML = '<div class="err">栏目不存在</div>'; return; }
    var item = null;
    (pack.items || []).forEach(function (it) { if (String(it.id) === String(id)) item = it; });
    if (!item) { app.innerHTML = '<div class="err">条目不存在</div>'; return; }
    var h = '<span class="back" id="back-cat">← 返回' + esc(pack.category.name) + '</span>' +
      '<div class="detail-card"><div class="detail-head">' + thumbHtml(item, true) +
      '<div><h2>' + esc(item.name) + '</h2><div class="sm">' + esc(item.summary) + '</div>' +
      '<div class="meta-line">' + (item.score != null ? '评分 ' + item.score + ' · ' : '') + '第 ' + item.rank + ' 名' + (item.region ? ' · ' + esc(item.region) : '') + '</div>' +
      (item.tags && item.tags.length ? '<div class="tags">' + item.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div></div>' + metaTags(slug, item);
    if (item.usageKind === 'config' || item.usageKind === 'api') {
      var label = item.usageKind === 'config' ? '整份配置' : '单个接口（零件）';
      h += '<div class="kind-big ' + item.usageKind + '"><b>类型：' + label + '</b>' +
        (item.usageNote ? '<span class="note">' + esc(item.usageNote) + '</span>' : '') + '</div>';
    }
    h += urlRow('地址', item.url);
    if (item.builtinConfigUrl) {
      h += '<h4 class="sec">现成整份配置' + (item.builtinConfigName ? '：' + esc(item.builtinConfigName) : '') + '</h4>' +
        '<div class="urlrow"><span class="u"><a href="' + esc(item.builtinConfigUrl) + '" target="_blank" rel="noopener">' + esc(item.builtinConfigUrl) + '</a></span>' + copyBtn(item.builtinConfigUrl) + '</div>';
    }
    if (item.descriptionOriginal) {
      h += '<h4 class="sec">原文介绍</h4><div class="desc">' + esc(item.descriptionOriginal) + '</div>' +
        '<h4 class="sec">中文说明</h4><div class="desc">' + esc(item.description) + '</div>';
    } else if (item.description) {
      h += '<h4 class="sec">详细介绍</h4><div class="desc">' + esc(item.description) + '</div>';
    }
    h += '<h4 class="sec">应用截图</h4>';
    if (item.screenshots && item.screenshots.length) {
      h += '<div class="shots">' + item.screenshots.map(function (s) {
        return '<img src="' + esc(s) + '" alt="应用截图" loading="lazy" data-zoom="' + esc(s) + '">';
      }).join('') + '</div>';
    } else {
      h += '<div class="no-shot">暂无截图</div>';
    }
    if (item.details && item.details.length) {
      var PRIO = ['类别', '规则格式', '模块支持', '分流方式', '配套规则', '可加的东西', '上手步骤', '平台', '官方下载', '收费', '免费时长', '能否续费', '续费价格', '能否进 CF', '机器配置', '容量与发信量', '额度', '申请要求', '能干什么', '类型', '语言', '能否改中文', '下载地区', '现价', '原价', '最新版本', '版本日期', '最近更新', '最近检查'];
      var sortedDetails = item.details.slice().sort(function (a, b) {
        var ia = PRIO.indexOf(a.label), ib = PRIO.indexOf(b.label);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      h += '<h4 class="sec">详细数据</h4><table class="kv">';
      sortedDetails.forEach(function (d) {
        var v = d.value == null ? '' : String(d.value);
        var cell = isUrl(v)
          ? '<div class="urlrow"><span class="u"><a href="' + esc(v.trim()) + '" target="_blank" rel="noopener">' + esc(v) + '</a></span>' + copyBtn(v.trim()) + '</div>'
          : esc(v);
        h += '<tr><td class="k">' + esc(d.label) + '</td><td class="v">' + cell + '</td></tr>';
      });
      h += '</table>';
    }
    if (item.warning) h += '<div class="warn">⚠ ' + esc(item.warning) + '</div>';
    if (item.sourceUrl) {
      h += '<h4 class="sec">出处</h4><div class="urlrow"><span class="u"><a href="' + esc(item.sourceUrl) + '" target="_blank" rel="noopener">' + esc(item.sourceUrl) + '</a></span>' + copyBtn(item.sourceUrl) + '</div>';
    }
    h += '<div class="meta-line">核实日期：' + esc(item.verifiedAt || '—') + '</div></div>';
    app.innerHTML = h;
    document.getElementById('back-cat').addEventListener('click', function () { location.hash = '#/cat/' + slug; });
    app.querySelectorAll('[data-zoom]').forEach(function (img) {
      img.addEventListener('click', function () { lbImg.src = img.getAttribute('data-zoom'); lightbox.classList.add('open'); });
    });
    window.scrollTo(0, 0);
  }

  /* ---------- 路由 ---------- */
  function route() {
    if (!DATA) return;
    var hash = location.hash || '#/';
    var m;
    if ((m = hash.match(/^#\/item\/([a-z]+)\/(\d+)/))) { renderDetail(m[1], m[2]); }
    else if ((m = hash.match(/^#\/cat\/([a-z]+)/))) { renderCategory(m[1], '', ''); window.scrollTo(0, 0); }
    else { renderHome(); window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', route);

  fetch('data.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { DATA = d; route(); })
    .catch(function (e) { app.innerHTML = '<div class="err">数据加载失败：' + esc(e.message) + '<br>请确认 data.json 与本页在同一目录。</div>'; });
})();
</script>
</body>
</html>
